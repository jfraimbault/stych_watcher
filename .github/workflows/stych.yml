name: Stych Watcher

on:
  schedule:
    # Toutes les 15 minutes (syntaxe cron standard)
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      days_ahead:
        description: 'Jours à surveiller'
        required: false
        default: '20'
      min_hour:
        description: 'Heure minimale (format HH:MM, vide = pas de restriction)'
        required: false
        default: '15:30'

permissions:
  contents: write  # nécessaire pour re-committer le fichier d'état

concurrency:
  group: stych-watcher
  cancel-in-progress: false  # on attend que le run précédent finisse, plutôt que de l'annuler

jobs:
  check-slots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run Stych watcher
        env:
          STYCH_EMAIL: ${{ secrets.STYCH_EMAIL }}
          STYCH_PASSWORD: ${{ secrets.STYCH_PASSWORD }}
          STYCH_DAYS_AHEAD: ${{ github.event.inputs.days_ahead || '20' }}
          STYCH_ALLOWED_CITIES: "ORVAULT,ST HERBLAIN"
          STYCH_MIN_HOUR: ${{ github.event.inputs.min_hour || '15:30' }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python stych_watcher.py

      - name: Commit updated state file (si changement)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stych_seen_slots.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update seen slots [skip ci]"
          git push
